version: "1.0"
plugin_id: conversational-bi-analyst
capabilities:
  - id: analytical_warehouse_query
    description: Read-only SQL metadata and query execution across BigQuery, Snowflake, Databricks, and Looker.
    required: true
    mode_a_live_connectors:
      - connector: bigquery_api
        endpoint_template: https://bigquery.googleapis.com/bigquery/v2/projects/{project_id}/queries
        auth_type: oauth2_service_account
        scopes: ["https://www.googleapis.com/auth/bigquery.readonly"]
      - connector: snowflake_sql_api
        endpoint_template: https://{account_identifier}.snowflakecomputing.com/api/v2/statements
        auth_type: workload_identity
        scopes: ["session:role:ANALYST_READONLY"]
      - connector: looker_api
        endpoint_template: https://{looker_host}/api/4.0/queries
        auth_type: oauth2_service_account
        scopes: ["read_metrics"]
    mode_b_workspace_fallback:
      google_workspace_sources: ["Google Sheets", "Google Drive"]
      lookup_hint: Read Connected Sheets exports or KPI Extracts stored in BI & Finance Shared Drives.
    mode_c_local_file_formats: ["json", "csv", "sql"]
