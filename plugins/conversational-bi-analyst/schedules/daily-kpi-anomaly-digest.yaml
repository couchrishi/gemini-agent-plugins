apiVersion: gemini-agent/v1alpha1
kind: ScheduleTemplate
metadata:
  name: daily-kpi-anomaly-digest
  plugin: conversational-bi-analyst
spec:
  cron_expression: "0 7 * * 1-5"
  timezone: "UTC"
  max_token_budget: 20000
  target_skill: kpi-anomaly-driver-tree
  prompt: |
    Run the daily KPI variance and z-score anomaly check using scripts/mix_rate_volume_bridge.py.
    Decompose revenue/margin changes into exact Volume, Mix, and Rate effects, flag segments exceeding
    zscore_anomaly_threshold, and save an internal Canvas digest without emailing distribution lists.
  goal_verifier:
    command_check: "python3 skills/kpi-anomaly-driver-tree/scripts/mix_rate_volume_bridge.py --help"
    nl_criteria:
      - "Volume + Mix + Rate effects sum strictly to total period-over-period delta."
      - "Segments with sample size below min_sample_size_guard carry LOW_SAMPLE_SIZE caution."
      - "Baseline stamp appears whenever org_configured is false."
