apiVersion: gemini-agent/v1alpha1
kind: ScheduleTemplate
metadata:
  name: weekly-corpus-hygiene-audit
  plugin: enterprise-knowledge-hub
spec:
  cron_expression: "0 7 * * 1"
  timezone: "UTC"
  max_token_budget: 24000
  target_skill: knowledge-gap-freshness-audit
  prompt: |
    Run the weekly enterprise knowledge hygiene scan across Drive, SharePoint, and Confluence metadata exports.
    Execute scripts/corpus_hygiene_scanner.py against the latest corpus inventory and ticket-topic gap feed,
    highlight stale/unreviewed SOPs, departed owners, unpublished minor versions, and top unindexed support topics,
    and draft a remediation sheet for owner confirmation without archiving any file automatically.
  goal_verifier:
    command_check: "python3 skills/knowledge-gap-freshness-audit/scripts/corpus_hygiene_scanner.py --help"
    nl_criteria:
      - "All stale-age, duplicate-similarity, and missing-review calculations are executed by corpus_hygiene_scanner.py."
      - "Null last_reviewed_at timestamps are explicitly flagged as unverified/overdue rather than fresh."
      - "No documents are archived, deleted, or modified without explicit HITL confirmation."
