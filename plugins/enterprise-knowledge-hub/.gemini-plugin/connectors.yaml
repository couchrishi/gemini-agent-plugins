version: "1.0"
plugin_id: enterprise-knowledge-hub
capabilities:
  - id: enterprise_document_search
    description: Federated retrieval of internal policies, SOPs, runbooks, and architecture docs across Google Workspace, SharePoint, and Confluence.
    required: true
    mode_a_live_connectors:
      - connector: google_drive_api
        endpoint_template: https://www.googleapis.com/drive/v3/files
        auth_type: oauth2_user
        scopes: ["https://www.googleapis.com/auth/drive.readonly"]
      - connector: microsoft_graph_sharepoint
        endpoint_template: https://graph.microsoft.com/v1.0/search/query
        auth_type: oauth2_user
        scopes: ["Sites.Read.All", "Files.Read.All"]
      - connector: atlassian_confluence_cloud
        endpoint_template: https://{tenant_domain}.atlassian.net/wiki/rest/api/content/search
        auth_type: oauth2_user
        scopes: ["read:confluence-content.all"]
    mode_b_workspace_fallback:
      google_workspace_sources: ["Google Drive", "Google Docs", "Google Sheets"]
      lookup_hint: Search Shared Drives with includeItemsFromAllDrives=true and inspect all child tabs in Google Docs.
    mode_c_local_file_formats: ["json", "csv", "md", "txt"]
  - id: support_ticket_gap_signal
    description: Optional resolved support ticket topics used to detect missing or outdated self-service KB coverage.
    required: false
    mode_a_live_connectors:
      - connector: servicenow_table_api
        endpoint_template: https://{instance}.service-now.com/api/now/table/incident
        auth_type: oauth2_service_account
        scopes: ["itil_read"]
    mode_b_workspace_fallback:
      google_workspace_sources: ["Google Sheets", "Google Drive"]
      lookup_hint: Locate exported ticket topic summary Sheets in the Knowledge Ops Shared Drive folder.
    mode_c_local_file_formats: ["csv", "json"]
