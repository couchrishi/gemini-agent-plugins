version: '1.0'
plugin_id: public-sector-higher-ed
capabilities:
- id: case_erp_and_grants_repositories
  description: Case management portals, e-procurement sealed bid stores, sponsored
    research ledgers, and Workspace accreditation folders.
  required: true
  mode_a_live_connectors:
  - connector: servicenow_table_api
    endpoint_template: https://{instance}.service-now.com/api/now/table/sn_csm_case
    auth_type: oauth2_service_account
    scopes:
    - case.read
    - procurement.read
  - connector: bigquery_sql_api
    endpoint_template: https://bigquery.googleapis.com/bigquery/v2/projects/{project_id}/queries
    auth_type: workload_identity
    scopes:
    - https://www.googleapis.com/auth/bigquery.readonly
  mode_b_workspace_fallback:
    google_workspace_sources:
    - Google Drive
    - Google Sheets
    - Google Docs
    lookup_hint: Read Benefits Intake Packets, Bid Tabulation Sheets (`UNFORMATTED_VALUE`),
      Grant Budget Sheets, and Accreditation Folders in Shared Drives.
  mode_c_local_file_formats:
  - json
  - csv
