apiVersion: gemini-agent/v1alpha1
kind: ScheduleTemplate
metadata:
  name: weekly-accreditation-evidence-watch
  plugin: public-sector-higher-ed
spec:
  cron_expression: 0 8 * * 1
  timezone: UTC
  max_token_budget: 20000
  target_skill: grant-accreditation-evidence-pack
  prompt: Run the weekly sponsored grant allowability and accreditation artifact freshness
    check via scripts/grant_accreditation_validator.py across active institutional
    packets.
  goal_verifier:
    command_check: python3 skills/grant-accreditation-evidence-pack/scripts/grant_accreditation_validator.py
      --help
    nl_criteria:
    - Unallowable costs and F&A rate overages trigger explicit BLOCKER findings.
    - Artifacts older than max_evidence_age_days flag STALE_EVIDENCE.
    - Standard baseline stamp appears when org_configured is false.
