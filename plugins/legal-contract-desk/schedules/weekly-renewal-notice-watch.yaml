apiVersion: gemini-agent/v1alpha1
kind: ScheduleTemplate
metadata:
  name: weekly-renewal-notice-watch
  plugin: legal-contract-desk
spec:
  cron_expression: "0 8 * * 1"
  timezone: "UTC"
  max_token_budget: 20000
  target_skill: executed-obligation-extractor
  prompt: |
    Run the weekly executed contract renewal and obligation watch via scripts/obligation_calendar_builder.py.
    Compute exact opt-out notice deadlines (`renewal_date - notice_days`), surface urgent <=30 day windows
    and uncapped CPI escalators, and generate a draft reminder pack without emailing counterparties.
  goal_verifier:
    command_check: "python3 skills/executed-obligation-extractor/scripts/obligation_calendar_builder.py --help"
    nl_criteria:
      - "Opt-out notice deadlines equal renewal_date minus notice_days exactly."
      - "Contracts missing notice_days or renewal_date are flagged UNVERIFIED rather than assumed clean."
      - "Baseline banner appears whenever org_configured is false."
