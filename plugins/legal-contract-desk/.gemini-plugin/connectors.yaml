version: "1.0"
plugin_id: legal-contract-desk
capabilities:
  - id: clm_and_contract_repository
    description: Commercial contract drafts, redlines, executed MSAs/DPAs, and approved Legal Playbooks across CLM, Google Workspace, or SharePoint.
    required: true
    mode_a_live_connectors:
      - connector: google_drive_api
        endpoint_template: https://www.googleapis.com/drive/v3/files
        auth_type: oauth2_user
        scopes: ["https://www.googleapis.com/auth/drive.readonly"]
      - connector: microsoft_graph_sharepoint
        endpoint_template: https://graph.microsoft.com/v1.0/sites/{site_id}/drive/root/children
        auth_type: oauth2_user
        scopes: ["Sites.Read.All", "Files.Read.All"]
    mode_b_workspace_fallback:
      google_workspace_sources: ["Google Docs", "Google Sheets", "Google Drive"]
      lookup_hint: Inspect Legal Playbook Docs (all child tabs) and Executed Contract Registry Sheets in Legal Shared Drives.
    mode_c_local_file_formats: ["json", "csv", "md", "txt"]
  - id: compliance_control_register
    description: Internal security/privacy control register and audit evidence dates for regulatory gap mapping.
    required: false
    mode_a_live_connectors:
      - connector: servicenow_grc_api
        endpoint_template: https://{instance}.service-now.com/api/now/table/sn_compliance_control
        auth_type: oauth2_service_account
        scopes: ["grc_read"]
    mode_b_workspace_fallback:
      google_workspace_sources: ["Google Sheets", "Google Drive"]
      lookup_hint: Read Control Register & Audit Evidence Sheets in Compliance Shared Drives.
    mode_c_local_file_formats: ["json", "csv"]
