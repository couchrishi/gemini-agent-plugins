skill_id: employee-onboarding-navigator
plugin_id: people-ops-talent-hub
version: '1.0'
deterministic_checks:
  expected_script: scripts/onboarding_plan_builder.py
  required_output_keys:
  - baseline_mode
  - summary
  - onboarding_plans
  must_include_patterns:
  - '[EVALUATED AGAINST STANDARD BASELINE — BIND ORG CONFIG TO CUSTOMIZE]'
  - missing_mandatory_gates
  must_not_include_patterns:
  - treated missing Day-1 SSO gate as complete
  hitl_required_for_mutations: true
  trap_checks:
  - Flags missing mandatory Day-1 gates explicitly.
  - Detects overdue items relative to start_date + due_day_offset.
scenarios:
- id: live_day1_gate_gap
  mode: live_connector
  prompt: Check upcoming Stratos Telecom hires in Workday/ServiceNow HRSD for missing laptop or SSO gates.
  expected_assertions:
  - Flags AT_RISK_MISSING_DAY1_GATES whenever identity_sso_provisioning is omitted.
  - Computes exact overdue_tasks and blocked dependencies.
- id: workspace_sheets_stalled_30d
  mode: workspace_connector
  prompt: Audit our Drive Onboarding Sheet for hires > 30 days past start with incomplete compliance tasks.
  expected_assertions:
  - Calculates days_since_start and overdue task counts accurately.
  - Applies baseline banner when org_configured is false.
- id: local_local_plan_gen
  mode: local_file
  prompt: Run onboarding_plan_builder.py on hires.json as of 2026-11-10.
  expected_assertions:
  - Breaks down phase completion across day_1/day_30/day_60/day_90.
  - Surfaces stalled hires cleanly.
rubric:
- criterion: day1_gate_verification
  weight: 0.4
  description: Flags missing Day-1 provisioning tasks reliably.
- criterion: milestone_and_dependency_math
  weight: 0.35
  description: Computes exact due dates and dependency chains.
- criterion: baseline_and_hitl_clarity
  weight: 0.25
  description: Follows baseline banner and escalation gates.
