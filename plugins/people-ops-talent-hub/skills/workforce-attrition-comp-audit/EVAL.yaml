skill_id: workforce-attrition-comp-audit
plugin_id: people-ops-talent-hub
version: '1.0'
deterministic_checks:
  expected_script: scripts/comp_band_analyzer.py
  required_output_keys:
  - baseline_mode
  - summary
  - department_rollups
  - comp_outliers
  must_include_patterns:
  - '[EVALUATED AGAINST STANDARD BASELINE — BIND ORG CONFIG TO CUSTOMIZE]'
  - contingent_worker_isolated_count
  must_not_include_patterns:
  - disclosed small-cell cohort averages below privacy floor
  hitl_required_for_mutations: true
  trap_checks:
  - Deduplicates effective_date <= as_of_date per worker_id.
  - Suppresses avg_compa_ratio and attrition_pct when fte_headcount < 5.
scenarios:
- id: live_workday_effective_dates
  mode: live_connector
  prompt: Audit Workday roster where promoted employees have 3 historical effective_date rows plus 1 future-dated row and 4 CWKs.
  expected_assertions:
  - Selects latest effective_date <= as_of_date and excludes future rows.
  - Isolates CWKs so FTE headcount and compa-ratios are exact.
- id: workspace_sheets_privacy_floor
  mode: workspace_connector
  prompt: Check department compa-ratios from Drive Sheet where Legal has 3 FTEs and Engineering has hourly + EUR staff.
  expected_assertions:
  - Redacts Legal avg_compa_ratio and attrition_pct (suppressed_for_privacy=true).
  - Normalizes hourly * 2080 and EUR FX properly.
- id: local_local_csv_outliers
  mode: local_file
  prompt: Analyze workers.csv for <0.80 compression and >1.25 ceiling outliers.
  expected_assertions:
  - Flags BELOW_BAND_COMPRESSION and ABOVE_BAND_CEILING outliers accurately.
  - Maintains baseline disclosure banner.
rubric:
- criterion: effective_date_and_cwk_rigor
  weight: 0.4
  description: Deduplicates effective-dated snapshots and isolates CWK rows cleanly.
- criterion: pay_normalization_and_privacy
  weight: 0.35
  description: Normalizes frequency/FX and enforces n>=5 privacy suppression.
- criterion: outlier_detection_and_hitl
  weight: 0.25
  description: Flags band outliers accurately and keeps HRIS writes HITL-gated.
