apiVersion: gemini-agent/v1alpha1
kind: ScheduleTemplate
metadata:
  name: weekly-onboarding-stall-watch
  plugin: people-ops-talent-hub
spec:
  cron_expression: 0 8 * * 1
  timezone: UTC
  max_token_budget: 20000
  target_skill: employee-onboarding-navigator
  prompt: Run the weekly onboarding gate check via scripts/onboarding_plan_builder.py
    to detect missing Day-1 IT/security gates and stalled 30/60/90 milestones.
  goal_verifier:
    command_check: python3 skills/employee-onboarding-navigator/scripts/onboarding_plan_builder.py
      --help
    nl_criteria:
    - Missing Day-1 mandatory gates are flagged AT_RISK_MISSING_DAY1_GATES rather
      than assumed complete.
    - Overdue tasks are escalated to IT, HR, and hiring managers.
    - Baseline banner appears whenever org_configured is false.
