apiVersion: gemini-agent/v1alpha1
kind: ScheduleTemplate
metadata:
  name: daily-ap-grir-exception-watch
  plugin: finance-variance-recon
spec:
  cron_expression: "0 6 * * 1-5"
  timezone: "UTC"
  max_token_budget: 24000
  target_skill: ap-three-way-match
  prompt: |
    Run the weekday morning AP 3-way match sweep using scripts/reconcile_3way.py across open vendor invoices,
    purchase orders, and goods receipts. Surface duplicate invoice suspects, bank-change holds, TCURX decimal
    mismatches, and price/quantity exceptions for AP Controller review without releasing payments.
  goal_verifier:
    command_check: "python3 skills/ap-three-way-match/scripts/reconcile_3way.py --help"
    nl_criteria:
      - "Zero-decimal currencies (JPY, KRW) and SAP SHKZG credits are normalized prior to variance math."
      - "Duplicate suspect invoices and vendor bank-change flags block clearance immediately."
      - "Baseline disclosure banner is present whenever org_configured is false."
