version: "1.0"
plugin_id: finance-variance-recon
capabilities:
  - id: erp_gl_and_subledger
    description: SAP S/4HANA / Oracle ERP AP invoices, PO/GRN tables, AR open items, and BigQuery GL summary/leaf marts.
    required: true
    mode_a_live_connectors:
      - connector: sap_odata_api
        endpoint_template: https://{erp_host}/sap/opu/odata/sap/API_SUPPLIERINVOICE_PROCESS_SRV
        auth_type: mtls_oauth2
        scopes: ["sap.invoice.read", "sap.po.read", "sap.gl.read"]
      - connector: bigquery_sql_api
        endpoint_template: https://bigquery.googleapis.com/bigquery/v2/projects/{project_id}/queries
        auth_type: workload_identity
        scopes: ["https://www.googleapis.com/auth/bigquery.readonly"]
    mode_b_workspace_fallback:
      google_workspace_sources: ["Google Sheets", "Google Drive", "Google Docs"]
      lookup_hint: Read Finance Close Workbooks (UNFORMATTED_VALUE), AP Exception Sheets, and AR Aging exports in Finance Shared Drives.
    mode_c_local_file_formats: ["json", "csv", "tsv"]
  - id: treasury_and_vendor_notifications
    description: Outbound vendor inquiry context, bank-change verification emails, and customer AR dunning packets.
    required: false
    mode_a_live_connectors:
      - connector: google_drive_api
        endpoint_template: https://www.googleapis.com/drive/v3/files
        auth_type: oauth2_user
        scopes: ["https://www.googleapis.com/auth/drive.readonly"]
    mode_b_workspace_fallback:
      google_workspace_sources: ["Gmail", "Google Docs", "Google Drive"]
      lookup_hint: Inspect vendor email notifications for unverified bank-change requests without executing payment updates.
    mode_c_local_file_formats: ["json", "md", "txt"]
