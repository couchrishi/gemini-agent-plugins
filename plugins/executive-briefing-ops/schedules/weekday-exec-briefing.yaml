apiVersion: gemini-agent/v1alpha1
kind: ScheduleTemplate
metadata:
  name: weekday-exec-briefing
  plugin: executive-briefing-ops
spec:
  cron_expression: "30 6 * * 1-5"
  timezone: "UTC"
  max_token_budget: 20000
  target_skill: daily-executive-briefing
  prompt: |
    Build the weekday morning executive briefing using scripts/agenda_commitment_tracker.py.
    Detect overlapping meetings, missing pre-read documents, back-to-back fatigue stretches,
    and overdue action commitments, and save a private Google Doc brief without sending any external emails.
  goal_verifier:
    command_check: "python3 skills/daily-executive-briefing/scripts/agenda_commitment_tracker.py --help"
    nl_criteria:
      - "Double-bookings and back-to-back gaps are computed deterministically from ISO timestamps."
      - "Missing pre-read attachments are explicitly reported rather than skipped."
      - "No emails or calendar declines are sent autonomously."
