version: "1.0"
plugin_id: executive-briefing-ops
capabilities:
  - id: calendar_and_mail_context
    description: Reads daily calendar agendas, pre-read links, and priority email threads across Google Workspace or Microsoft 365.
    required: true
    mode_a_live_connectors:
      - connector: google_calendar_api
        endpoint_template: https://www.googleapis.com/calendar/v3/calendars/primary/events
        auth_type: oauth2_user
        scopes: ["https://www.googleapis.com/auth/calendar.readonly"]
      - connector: gmail_api
        endpoint_template: https://gmail.googleapis.com/gmail/v1/users/me/messages
        auth_type: oauth2_user
        scopes: ["https://www.googleapis.com/auth/gmail.readonly"]
      - connector: microsoft_graph_calendar_mail
        endpoint_template: https://graph.microsoft.com/v1.0/me/calendarView
        auth_type: oauth2_user
        scopes: ["Calendars.Read", "Mail.Read"]
    mode_b_workspace_fallback:
      google_workspace_sources: ["Google Calendar", "Gmail", "Google Meet", "Google Docs"]
      lookup_hint: Inspect Calendar event descriptions and Google Meet transcript Docs in the Executive Prep folder.
    mode_c_local_file_formats: ["json", "csv", "md", "txt"]
  - id: account_and_escalation_context
    description: Optional CRM renewal dates and open P1/P2 escalation feeds for customer stakeholder briefings.
    required: false
    mode_a_live_connectors:
      - connector: salesforce_soql_api
        endpoint_template: https://{my_domain}.my.salesforce.com/services/data/v61.0/query
        auth_type: oauth2_user
        scopes: ["api"]
    mode_b_workspace_fallback:
      google_workspace_sources: ["Google Sheets", "Google Drive"]
      lookup_hint: Locate Account Health Tracker Sheet in Executive Shared Drive.
    mode_c_local_file_formats: ["json", "csv"]
