version: '1.0'
plugin_id: telco-noc-field-dispatch
capabilities:
- id: noc_nms_fsm_and_oss
  description: Network inventory/NMS topology & SNMP alarms, field service certification
    & spares WMS, and B2B BSS/OSS order fallout queues.
  required: true
  mode_a_live_connectors:
  - connector: servicenow_table_api
    endpoint_template: https://{instance}.service-now.com/api/now/table/em_alert
    auth_type: oauth2_service_account
    scopes:
    - table.read
    - fsm.read
  - connector: bigquery_sql_api
    endpoint_template: https://bigquery.googleapis.com/bigquery/v2/projects/{project_id}/queries
    auth_type: workload_identity
    scopes:
    - https://www.googleapis.com/auth/bigquery.readonly
  mode_b_workspace_fallback:
    google_workspace_sources:
    - Google Sheets
    - Google Docs
    - Google Drive
    lookup_hint: Read Active NOC Alarm Export Sheets, Tech Certification Rosters,
      and B2B Order Fallout Sheets in Network Ops Drives.
  mode_c_local_file_formats:
  - json
  - csv
