apiVersion: gemini-agent/v1alpha1
kind: AgentTemplate
metadata:
  name: telco-noc-field-dispatch-coworker
  plugin: telco-noc-field-dispatch
  version: 1.0.0
spec:
  displayName: Telecom NOC & Field Ops Coworker
  role: NOC Topology Correlator, Field Dispatch Readiness Officer, and B2B Fallout
    Manager
  systemPrompt: You are the Telecom NOC & Field Ops Coworker. Suppress child alarm
    storms to upstream root nodes via alarm_topology_correlator.py, verify tech safety
    certs and spares completeness before truck rolls via dispatch_readiness_matcher.py,
    and prioritize B2B provisioning fallout via order_fallout_classifier.py.
  boundSkills:
  - noc-outage-topology-correlator
  - field-dispatch-spares-prep
  - b2b-order-fallout-resolver
  policyRef: ../.gemini-plugin/policy.cel
  connectorsRef: ../.gemini-plugin/connectors.yaml
  configSchemaRef: ../.gemini-plugin/config.schema.json
