apiVersion: gemini-agent/v1alpha1
kind: ScheduleTemplate
metadata:
  name: daily-grir-aging-watch
  plugin: erp-procure-to-pay
spec:
  cron_expression: 0 7 * * 1-5
  timezone: UTC
  max_token_budget: 20000
  target_skill: gr-ir-clearing-orchestrator
  prompt: Execute weekday SAP GR/IR clearing aging check via scripts/gr_ir_reconciler.py
    to isolate IR_WITHOUT_GR blocks and >60 day accruals.
  goal_verifier:
    command_check: python3 skills/gr-ir-clearing-orchestrator/scripts/gr_ir_reconciler.py
      --help
    nl_criteria:
    - Zero-decimal currencies and SHKZG reversals are normalized cleanly.
    - IR_WITHOUT_GR lines trigger payment blocks.
    - Standard baseline stamp appears when org_configured is false.
