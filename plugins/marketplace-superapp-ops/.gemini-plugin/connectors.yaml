version: '1.0'
plugin_id: marketplace-superapp-ops
capabilities:
- id: marketplace_catalog_dispatch_psp
  description: Merchant catalog submission queues, real-time order dispatch timestamps,
    and PSP merchant settlement ledgers.
  required: true
  mode_a_live_connectors:
  - connector: bigquery_sql_api
    endpoint_template: https://bigquery.googleapis.com/bigquery/v2/projects/{project_id}/queries
    auth_type: workload_identity
    scopes:
    - https://www.googleapis.com/auth/bigquery.readonly
  - connector: rest_webhook_api
    endpoint_template: https://api.marketplace.example.com/v1/settlements/reconcile
    auth_type: oauth2_service_account
    scopes:
    - catalog.read
    - payouts.read
  mode_b_workspace_fallback:
    google_workspace_sources:
    - Google Sheets
    - Google Docs
    - Google Drive
    lookup_hint: Read Merchant Listing Queues, Zone Delivery SLA Logs, and Weekly
      PSP Payout Sheets in SuperApp Ops Drives.
  mode_c_local_file_formats:
  - json
  - csv
