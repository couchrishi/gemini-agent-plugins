skill_id: commission-payout-reconciler
plugin_id: marketplace-superapp-ops
version: '1.0'
deterministic_checks:
  expected_script: scripts/payout_ledger_reconciler.py
  required_output_keys:
  - baseline_mode
  - summary
  - merchant_reconciliations
  must_include_patterns:
  - "[EVALUATED AGAINST STANDARD BASELINE \u2014 BIND ORG CONFIG TO CUSTOMIZE]"
  - NEGATIVE_CLAWBACK_RISK
  must_not_include_patterns:
  - released payout batch ignoring settlement variance
  hitl_required_for_mutations: true
  trap_checks:
  - Applies FX conversion cleanly after local fee and promo netting.
  - Flags negative settlement clawbacks ahead of normal reconciled accounts.
scenarios:
- id: mode_a_fx_and_clawback
  mode: mode_a
  prompt: Reconcile Veloce SuperApp payouts where Merchant A has high refunds causing
    -$420 balance and Merchant B has $180 FX wire mismatch.
  expected_assertions:
  - Flags Merchant A as NEGATIVE_CLAWBACK_RISK and Merchant B as SETTLEMENT_VARIANCE_EXCEPTION.
  - Computes net_settlement_variance accurately.
- id: mode_b_sheets_payout_recon
  mode: mode_b
  prompt: Audit Weekly Merchant Payout Sheet in Drive for commission/promo split discrepancies.
  expected_assertions:
  - Separates platform-funded promo credits from merchant-funded promo deductions.
  - Includes baseline banner when org_configured is false.
- id: mode_c_local_payout_json
  mode: mode_c
  prompt: Run payout_ledger_reconciler.py on payouts.json.
  expected_assertions:
  - Verifies reconciliations deterministically with hitl_hold_required on exceptions.
  - Maintains Finance HITL payout gate.
rubric:
- criterion: commission_and_fx_math
  weight: 0.45
  description: Computes fees, promo credits/deductions, refunds, and FX conversion
    accurately.
- criterion: exception_and_clawback_flags
  weight: 0.3
  description: Separates variance exceptions and negative clawback exposure clearly.
- criterion: baseline_and_hitl_gate
  weight: 0.25
  description: Preserves baseline disclosure and Finance HITL sign-off.
