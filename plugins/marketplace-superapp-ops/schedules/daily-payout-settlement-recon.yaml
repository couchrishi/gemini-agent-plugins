apiVersion: gemini-agent/v1alpha1
kind: ScheduleTemplate
metadata:
  name: daily-payout-settlement-recon
  plugin: marketplace-superapp-ops
spec:
  cron_expression: 15 4 * * *
  timezone: UTC
  max_token_budget: 20000
  target_skill: commission-payout-reconciler
  prompt: Run daily merchant payout vs PSP bank settlement reconciliation via scripts/payout_ledger_reconciler.py
    and escalate negative clawback balances before bank cutoff.
  goal_verifier:
    command_check: python3 skills/commission-payout-reconciler/scripts/payout_ledger_reconciler.py
      --help
    nl_criteria:
    - All commissions, promo splits, refunds, and FX conversions reconcile before
      comparing bank wire.
    - Negative clawback merchants flag NEGATIVE_CLAWBACK_RISK cleanly.
    - Standard baseline stamp appears when org_configured is false.
