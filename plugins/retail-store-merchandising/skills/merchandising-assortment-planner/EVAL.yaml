skill_id: merchandising-assortment-planner
plugin_id: retail-store-merchandising
version: '1.0'
deterministic_checks:
  expected_script: scripts/promo_lift_analyzer.py
  required_output_keys:
  - baseline_mode
  - summary
  - campaign_evaluations
  must_include_patterns:
  - "[EVALUATED AGAINST STANDARD BASELINE \u2014 BIND ORG CONFIG TO CUSTOMIZE]"
  - net_incremental_gm_usd
  must_not_include_patterns:
  - ignored cannibalization on deep discount
  hitl_required_for_mutations: true
  trap_checks:
  - Normalizes multi-week baseline to exact promo_days before lift calculation.
  - Deducts sibling cannibalization and promo execution cost cleanly.
scenarios:
- id: mode_a_cannibalization_net_loss
  mode: mode_a
  prompt: Evaluate Northstar Retail 7-day beverage promo with $18k cannibalization
    loss and $12k media spend against 28-day baseline.
  expected_assertions:
  - Normalizes 28d baseline to 7d run rate and classifies deep-discount net loss as
    MARGIN_DESTRUCTIVE.
  - Calculates exact promo_roi_ratio.
- id: mode_b_sheets_halo_attribution
  mode: mode_b
  prompt: Check Merchandising Promo Sheet with vendor coop funding and cross-category
    basket halo.
  expected_assertions:
  - Includes vendor_funding_rebate_usd and halo_gm_gain_usd in net_incremental_gm_usd.
  - Includes baseline banner when org_configured is false.
- id: mode_c_local_promo_json
  mode: mode_c
  prompt: Execute promo_lift_analyzer.py on promos.json.
  expected_assertions:
  - Ranks campaigns by net_incremental_gm_usd descending.
  - Keeps chain markdown sign-off HITL-gated.
rubric:
- criterion: denominator_normalization
  weight: 0.4
  description: Scales baseline units, revenue, and GM to promo_days accurately.
- criterion: net_margin_waterfall
  weight: 0.35
  description: Combines direct incremental GM, halo, cannibalization, coop funding,
    and execution cost.
- criterion: baseline_and_hitl_discipline
  weight: 0.25
  description: Applies baseline disclosure and merchant HITL gate.
