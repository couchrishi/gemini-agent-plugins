apiVersion: gemini-agent/v1alpha1
kind: ScheduleTemplate
metadata:
  name: weekly-pipeline-hygiene-audit
  plugin: deal-desk-rfp-engine
spec:
  cron_expression: "0 8 * * 1"
  timezone: "UTC"
  max_token_budget: 24000
  target_skill: pipeline-hygiene-slippage
  prompt: |
    Run the weekly Salesforce pipeline hygiene and slippage audit using scripts/pipeline_slippage_auditor.py.
    Normalize multi-currency opportunities, identify stale stages, >=2 push-count deals, single-threaded
    Commit opportunities, and StageName/IsClosed inconsistencies without modifying CRM records autonomously.
  goal_verifier:
    command_check: "python3 skills/pipeline-hygiene-slippage/scripts/pipeline_slippage_auditor.py --help"
    nl_criteria:
      - "Mixed-currency pipeline amounts are converted via explicit FX rates rather than summed raw."
      - "SOQL pagination truncation (done=false or totalSize > fetched) triggers TRUNCATION_WARNING."
      - "No CRM opportunity fields are modified without explicit user confirmation."
