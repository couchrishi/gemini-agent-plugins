version: "1.0"
plugin_id: deal-desk-rfp-engine
capabilities:
  - id: crm_opportunity_and_quotes
    description: Opportunities, multi-year quote ramps, DatedConversionRate FX tables, and activity/stage history in Salesforce CRM.
    required: true
    mode_a_live_connectors:
      - connector: salesforce_soql_api
        endpoint_template: https://{my_domain}.my.salesforce.com/services/data/v61.0/query
        auth_type: oauth2_user
        scopes: ["api"]
    mode_b_workspace_fallback:
      google_workspace_sources: ["Google Sheets", "Google Drive", "Google Docs"]
      lookup_hint: Locate Pipeline Export Sheets, Quote Pricing Calculators, and Deal Desk Guidelines in Revenue Ops Shared Drives.
    mode_c_local_file_formats: ["json", "csv"]
  - id: verified_rfp_answer_library
    description: Approved security, privacy, SOC2/ISO, and product capability Q&A library.
    required: false
    mode_a_live_connectors:
      - connector: google_drive_api
        endpoint_template: https://www.googleapis.com/drive/v3/files
        auth_type: oauth2_user
        scopes: ["https://www.googleapis.com/auth/drive.readonly"]
    mode_b_workspace_fallback:
      google_workspace_sources: ["Google Sheets", "Google Docs", "Google Drive"]
      lookup_hint: Read the Verified RFP Q&A Library Sheet inside the Deal Desk Shared Drive.
    mode_c_local_file_formats: ["json", "csv"]
