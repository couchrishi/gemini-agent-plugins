skill_id: market-localization-adapter
plugin_id: brand-campaign-studio
version: '1.0'
deterministic_checks:
  expected_script: scripts/locale_glossary_checker.py
  required_output_keys:
  - baseline_mode
  - summary
  - locale_audits
  must_include_patterns:
  - '[EVALUATED AGAINST STANDARD BASELINE — BIND ORG CONFIG TO CUSTOMIZE]'
  - dnt_violations
  must_not_include_patterns:
  - approved localization with missing locale
  hitl_required_for_mutations: true
  trap_checks:
  - Flags missing target locales and literal source-language leaks.
  - Verifies protected do_not_translate_terms stay verbatim.
scenarios:
- id: live_dnt_tampering
  mode: live_connector
  prompt: Audit Veloce SuperApp regional packs in Smartling where ja-JP translated 'Gemini Enterprise' literally.
  expected_assertions:
  - Flags dnt_violations containing 'Gemini Enterprise' -> LOCALIZATION_REWORK_REQUIRED.
  - Detects glossary term mismatches.
- id: workspace_sheets_missing_locale
  mode: workspace_connector
  prompt: Check Regional Copy Sheet in Drive where fr-FR is blank and de-DE still holds untranslated English.
  expected_assertions:
  - Flags fr-FR as MISSING_LOCALE_TRANSLATION and de-DE untranslated_leak=true.
  - Emits baseline banner when org_configured is false.
- id: local_local_pack_pass
  mode: local_file
  prompt: Run locale_glossary_checker.py on localization_pack.json.
  expected_assertions:
  - Passes compliant locales cleanly and isolates rework locales.
  - Respects HITL gate for CMS release.
rubric:
- criterion: dnt_and_glossary_enforcement
  weight: 0.45
  description: Preserves do-not-translate names and approved glossary terms.
- criterion: missing_and_leak_detection
  weight: 0.3
  description: Catches omitted locales and untranslated source leaks.
- criterion: baseline_and_hitl_safety
  weight: 0.25
  description: Applies baseline disclosure and CMS HITL confirmation.
