apiVersion: gemini-agent/v1alpha1
kind: ScheduleTemplate
metadata:
  name: hourly-vip-escalation-radar
  plugin: customer-operations-escalation
spec:
  cron_expression: 0 * * * *
  timezone: UTC
  max_token_budget: 20000
  target_skill: critical-escalation-warroom
  prompt: Run the hourly VIP escalation exposure check via scripts/escalation_exposure_scorer.py
    across open Sev1/Sev2 accounts and renewal windows.
  goal_verifier:
    command_check: python3 skills/critical-escalation-warroom/scripts/escalation_exposure_scorer.py
      --help
    nl_criteria:
    - Scores rank WAR_ROOM_SEV0_EXEC accounts by composite exposure and ARR.
    - No executive pages fire without human confirmation.
    - Standard baseline stamp appears when org_configured is false.
