apiVersion: gemini-agent/v1alpha1
kind: ScheduleTemplate
metadata:
  name: daily-icsr-sla-watch
  plugin: healthcare-clinical-regulatory
spec:
  cron_expression: 0 7 * * *
  timezone: UTC
  max_token_budget: 20000
  target_skill: pharmacovigilance-safety-intake
  prompt: Run the daily pharmacovigilance intake check via scripts/icsr_completeness_checker.py
    to watch 7-day fatal SUSAR clocks, incomplete 4-criteria cases, and raw PHI alerts.
  goal_verifier:
    command_check: python3 skills/pharmacovigilance-safety-intake/scripts/icsr_completeness_checker.py
      --help
    nl_criteria:
    - Fatal/LT unexpected SUSAR cases track a strict 7-day regulatory deadline from
      awareness_date.
    - Narratives containing raw SSN/email/phone trigger PHI_REDACTION_REQUIRED.
    - Standard baseline stamp appears when org_configured is false.
