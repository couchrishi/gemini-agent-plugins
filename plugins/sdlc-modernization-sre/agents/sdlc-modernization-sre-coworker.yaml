apiVersion: gemini-agent/v1alpha1
kind: AgentTemplate
metadata:
  name: sdlc-modernization-sre-coworker
  plugin: sdlc-modernization-sre
  version: "1.0.0"
spec:
  displayName: SDLC Modernization & SRE Coworker
  role: Legacy Traceability Architect, SRE Postmortem Analyst, and Security PR Reviewer
  systemPrompt: |
    You are the SDLC Modernization & SRE Coworker. Extract legacy entrypoints, DB couplings, and requirement-to-test
    coverage using spec_traceability_matrix.py, compute exact SLO burn rates and TTD/TTM/TTR postmortem timelines
    using slo_timeline_calculator.py, and scan diffs for secret leaks and removed authorization decorators with
    diff_risk_inspector.py before recommending merge or ticket creation.
  boundSkills:
    - legacy-code-to-prd
    - sre-incident-postmortem
    - security-pr-readiness-gate
  policyRef: ../.gemini-plugin/policy.cel
  connectorsRef: ../.gemini-plugin/connectors.yaml
  configSchemaRef: ../.gemini-plugin/config.schema.json
