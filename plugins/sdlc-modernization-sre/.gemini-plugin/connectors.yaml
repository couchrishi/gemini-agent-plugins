version: "1.0"
plugin_id: sdlc-modernization-sre
capabilities:
  - id: source_code_and_pr_diffs
    description: Git repositories, pull/merge request unified diffs, dependency manifests, and requirement specs across GitHub and GitLab.
    required: true
    mode_a_live_connectors:
      - connector: github_rest_api
        endpoint_template: https://api.github.com/repos/{owner}/{repo}/pulls
        auth_type: oauth2_service_account
        scopes: ["repo:status", "pull_requests:read"]
      - connector: gitlab_api
        endpoint_template: https://{gitlab_host}/api/v4/projects/{project_id}/merge_requests
        auth_type: oauth2_service_account
        scopes: ["read_api"]
    mode_b_workspace_fallback:
      google_workspace_sources: ["Google Drive", "Google Docs", "Google Sheets"]
      lookup_hint: Read exported Architecture Inventory Sheets, Postmortem Docs, and Diff Attachments in Engineering Shared Drives.
    mode_c_local_file_formats: ["json", "diff", "csv", "md", "txt"]
  - id: monitoring_and_incident_timeline
    description: SLO definitions, alert timestamps, and postmortem action trackers from Cloud Logging and ITSM/Jira.
    required: false
    mode_a_live_connectors:
      - connector: cloud_logging_api
        endpoint_template: https://logging.googleapis.com/v2/entries:list
        auth_type: workload_identity
        scopes: ["https://www.googleapis.com/auth/logging.read"]
      - connector: jira_api
        endpoint_template: https://{domain}.atlassian.net/rest/api/3/search/jql
        auth_type: oauth2_user
        scopes: ["read:jira-work"]
    mode_b_workspace_fallback:
      google_workspace_sources: ["Google Docs", "Google Sheets"]
      lookup_hint: Locate Incident Postmortem Docs and Action Tracker Sheets in SRE Shared Drives.
    mode_c_local_file_formats: ["json", "csv", "md"]
