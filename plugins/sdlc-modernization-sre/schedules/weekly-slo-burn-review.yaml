apiVersion: gemini-agent/v1alpha1
kind: ScheduleTemplate
metadata:
  name: weekly-slo-burn-review
  plugin: sdlc-modernization-sre
spec:
  cron_expression: "0 9 * * 1"
  timezone: "UTC"
  max_token_budget: 22000
  target_skill: sre-incident-postmortem
  prompt: |
    Run the weekly SRE reliability and postmortem action-item SLA audit via scripts/slo_timeline_calculator.py.
    Compute 30-day error-budget consumption across P1/P2 incidents, report TTD/TTM/TTR trends, and flag overdue
    postmortem corrective actions without mutating Jira issues autonomously.
  goal_verifier:
    command_check: "python3 skills/sre-incident-postmortem/scripts/slo_timeline_calculator.py --help"
    nl_criteria:
      - "Error budget burn percentage is calculated deterministically against 30-day SLO minutes."
      - "Open action items with missing due dates are flagged explicitly rather than marked compliant."
      - "Baseline stamp appears whenever org_configured is false."
