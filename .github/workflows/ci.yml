name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (full history for hygiene check)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation & test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pyyaml jsonschema

      - name: Verify dist/ archives and references are synced
        run: python3 tools/package.py --check

      - name: Run repository, SKILL.md, schema, CEL, and clean-room validation
        run: python3 tools/validate_repo.py

      - name: Run full test suite (all 60 engines + packaging)
        run: pytest -v
